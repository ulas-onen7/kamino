name: publish
on:
  release: { types: [published] }
# actions pinned by commit SHA, not mutable tag (launch review P0-6): a hijacked tag on a
# third-party action must not be able to alter what gets published. The comment names the
# tag each SHA was resolved from.
jobs:
  # the gate IS the release check: full suite on the exact release tree, then the built
  # wheel -- not the checkout -- must install and answer in a clean cwd. pypi publishes
  # the artifact this job tested, and cannot run if any step fails.
  gate:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with: { python-version: "3.12" }
      - run: pip install build pytest
      - run: python -m pytest -q
      - run: python -m build          # sdist + wheel
      - name: smoke-test the installed wheel, not the source tree
        run: |
          pip install dist/*.whl
          cd "$RUNNER_TEMP"
          kamino --version
          kamino --help > /dev/null
          python -m kamino --help > /dev/null
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with: { name: dist, path: dist/ }
  pypi:
    needs: gate
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    environment: pypi
    permissions: { id-token: write }
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # release/v1
